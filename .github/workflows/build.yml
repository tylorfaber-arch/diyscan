name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests (OBD parsers)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/diyscan.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/diyscan.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk diyscan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: diyscan-apk
          path: diyscan.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DIY Scan build ${{ github.run_number }}
          body: |
            Install: download **diyscan.apk** on your Android device and open it.
            You may need to allow "Install unknown apps" for your browser.

            Commit: ${{ github.sha }}
          files: diyscan.apk
          make_latest: true
